name: Deploy NARAPRIVAT ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies (client)
        run: npm ci
        working-directory: client

      - name: Install dependencies (server)
        run: npm ci
        working-directory: server

      - name: Seed data demo (server/data tidak ikut di-repo)
        run: node seed.js
        working-directory: server

      - name: Build standalone (versi 1 file + offline layer)
        run: npm run build -- --config vite.standalone.config.js
        working-directory: client

      - name: Inject offline data layer
        run: node tools/make-standalone.mjs

      - name: Siapkan folder static
        run: |
          mkdir -p _site/assets
          cp NARAPRIVAT-standalone.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment